version: '3.8'

# Build/push images before docker stack deploy; Swarm does not build images.
services:
  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to a shared registry image with version tag}
    environment:
      PORT: '5000'
      LOCAL_MODEL_DIR: /app/models
      LOCAL_CONFIDENCE: ${LOCAL_CONFIDENCE:-0.60}
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
    cap_drop: [ALL]
    stop_grace_period: 25s
    networks:
      - autobudget-net
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3))['modelLoaded']"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    deploy:
      replicas: ${APP_REPLICAS:-2}
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to a shared registry image with version tag}
    ports:
      - target: 8080
        published: ${APP_PORT:-8080}
        protocol: tcp
        mode: ingress
    networks:
      - autobudget-net
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 33554432
    cap_drop: [ALL]
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -Y, 'off', -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: ${APP_REPLICAS:-2}
      placement:
        max_replicas_per_node: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 16M
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        delay: 10s
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first

networks:
  autobudget-net:
    driver: overlay
