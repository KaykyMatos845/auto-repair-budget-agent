version: '3.8'
# Academic monitoring overlay. Run only on a trusted/private network.
services:
  monitor-proxy:
    image: ${MONITOR_IMAGE:?Set MONITOR_IMAGE to the shared registry monitor image}
    # Override the image healthcheck too, so existing v5 images need no rebuild.
    healthcheck:
      test: [CMD, python, -c, "import http.client; c=http.client.HTTPConnection('127.0.0.1',2375,timeout=5); c.request('GET','/healthz'); r=c.getresponse(); assert r.status == 200; r.read(); c.close()"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    volumes:
      - /var/run/docker.sock:/host/docker.sock:ro
    networks: [monitoring]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.50'
          memory: 64M
      restart_policy:
        condition: on-failure

  visualizer:
    image: dockersamples/visualizer@sha256:530c863672e7830d7560483df66beb4cbbcd375a9f3ec174ff5376616686a619
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
    environment:
      DOCKER_HOST: monitor-proxy:2375
    ports:
      - target: 8080
        published: ${VISUALIZER_PORT:-8081}
        protocol: tcp
        mode: host
    networks: [monitoring]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure

networks:
  monitoring:
    driver: overlay
