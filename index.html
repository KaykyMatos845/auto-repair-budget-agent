<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoBudget AI v3.0 — Vistoria Automotiva Profissional</title>
  <meta name="description" content="Sistema de orcamento automotivo com analise IA, calculo por operacao (R$80/h), alerta de perda total FIPE e links diretos Mercado Livre." />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>

:root {
  --fh: 'Outfit', sans-serif;
  --fb: 'Plus Jakarta Sans', sans-serif;
  --bg: #06080f;
  --card: rgba(14, 20, 34, 0.92);
  --border: rgba(245, 158, 11, 0.22);
  --border-hi: rgba(245, 158, 11, 0.55);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --dim: #64748b;
  --gold: #f59e0b;
  --gold-hi: #fbbf24;
  --violet: #8b5cf6;
  --emerald: #10b981;
  --rose: #f43f5e;
  --grad-gold: linear-gradient(135deg, #fbbf24, #d97706);
  --grad-brand: linear-gradient(135deg, #fbbf24 0%, #f43f5e 50%, #8b5cf6 100%);
  --grad-emerald: linear-gradient(135deg, #10b981, #059669);
  --grad-danger: linear-gradient(135deg, #f43f5e, #be123c);
  --shadow-gold: 0 0 28px rgba(245,158,11,0.25);
  --shadow-md: 0 10px 30px rgba(0,0,0,0.55);
  --r: 14px; --rs: 8px; --rfull: 9999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--fb); background: var(--bg); color: var(--text); min-height: 100vh;
  background-image:
    radial-gradient(circle at 8% 8%, rgba(245,158,11,0.12) 0%, transparent 38%),
    radial-gradient(circle at 92% 15%, rgba(139,92,246,0.14) 0%, transparent 42%),
    radial-gradient(circle at 50% 88%, rgba(16,185,129,0.08) 0%, transparent 50%);
  background-attachment: fixed;
}
h1,h2,h3,h4 { font-family: var(--fh); letter-spacing: -0.025em; }
.wrap { max-width: 1260px; margin: 0 auto; padding: 28px 18px; }
.card {
  background: var(--card); backdrop-filter: blur(22px);
  border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow-md); transition: border-color .25s;
}
.card:hover { border-color: var(--border-hi); }
.btn-gold {
  background: var(--grad-gold); color: #0a0c14; font-weight: 800;
  padding: 11px 22px; border-radius: var(--rs); border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: all .22s;
  font-size: .86rem; text-transform: uppercase; box-shadow: var(--shadow-gold);
}
.btn-gold:hover { transform: translateY(-2px); filter: brightness(1.12); }
.btn-gold:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn-whatsapp {
  background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; font-weight: 800;
  padding: 11px 22px; border-radius: var(--rs); border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: all .22s;
  font-size: .86rem; text-transform: uppercase; box-shadow: 0 0 20px rgba(37,211,102,0.35);
}
.btn-whatsapp:hover { transform: translateY(-2px); filter: brightness(1.1); }
.btn-ghost {
  background: rgba(255,255,255,0.05); color: var(--text); font-weight: 600;
  padding: 9px 16px; border-radius: var(--rs); border: 1px solid var(--border);
  cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: all .2s; font-size: .85rem;
}
.btn-ghost:hover { background: rgba(245,158,11,0.12); border-color: var(--gold); color: var(--gold-hi); }
.btn-emerald {
  background: var(--grad-emerald); color: #fff; font-weight: 800;
  padding: 11px 22px; border-radius: var(--rs); border: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: all .22s;
  font-size: .86rem; text-transform: uppercase; box-shadow: 0 0 22px rgba(16,185,129,0.3);
}
.btn-emerald:hover { transform: translateY(-2px); filter: brightness(1.12); }
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
  border-radius: var(--rfull); font-size: .7rem; font-weight: 800;
  text-transform: uppercase; letter-spacing: .06em;
}
.badge-replace { background: rgba(244,63,94,.18); color: #ff6b81; border: 1px solid rgba(244,63,94,.4); }
.badge-repair  { background: rgba(245,158,11,.18); color: #fbbf24; border: 1px solid rgba(245,158,11,.4); }
.badge-new     { background: rgba(139,92,246,.18); color: #c084fc; border: 1px solid rgba(139,92,246,.4); }
.badge-used    { background: rgba(16,185,129,.18); color: #34d399; border: 1px solid rgba(16,185,129,.4); }
.badge-ai      { background: rgba(6,182,212,.18); color: #22d3ee; border: 1px solid rgba(6,182,212,.4); }
.grad-text { background: var(--grad-brand); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.inp {
  width: 100%; padding: 9px 13px; background: rgba(10,14,24,0.9);
  border: 1px solid var(--border); border-radius: var(--rs); color: var(--text);
  font-size: .88rem; outline: none; transition: border-color .2s; font-family: var(--fb);
}
.inp:focus { border-color: var(--gold); }
label { font-size: .75rem; color: var(--muted); font-weight: 700; display: block; margin-bottom: 4px; }
.upload-zone {
  border: 2px dashed rgba(245,158,11,.35); border-radius: var(--r); padding: 32px 24px;
  text-align: center; background: rgba(10,14,24,.5); cursor: pointer; transition: all .25s;
}
.upload-zone:hover { border-color: var(--gold-hi); background: rgba(245,158,11,.07); }
.img-box-container { position: relative; display: inline-block; overflow: hidden; border-radius: 12px; border: 2px solid var(--border-hi); }
.bbox-overlay {
  position: absolute; border: 3px solid #f43f5e; background: rgba(244,63,94,0.25);
  border-radius: 6px; box-shadow: 0 0 14px rgba(244,63,94,0.7); pointer-events: none;
}
.bbox-label {
  position: absolute; top: -24px; left: -2px; background: #f43f5e; color: #fff;
  font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 4px 4px 4px 0;
  white-space: nowrap; text-transform: uppercase;
}
.op-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
@media (max-width: 700px) { .op-grid { grid-template-columns: repeat(3, 1fr); } }
.op-cell {
  background: rgba(6,8,15,.7); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 8px; text-align: center;
  transition: border-color .2s;
}
.op-cell:hover { border-color: var(--gold); }
.op-cell .op-val { font-size: 1rem; font-weight: 800; color: var(--gold-hi); margin-top: 4px; }
.op-cell .op-cost { font-size: .7rem; color: var(--emerald); margin-top: 2px; }
.tbl { width: 100%; border-collapse: collapse; font-size: .83rem; }
.tbl th { padding: 9px 10px; text-align: left; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--border); }
.tbl td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.tbl tr:hover td { background: rgba(245,158,11,0.04); }
@media print {
  body * { visibility: hidden; }
  #pdf-area, #pdf-area * { visibility: visible; }
  #pdf-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; }
  .no-print { display: none !important; }
}

  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;
const LABOR_RATE = 80;
const OPS = ['fun', 'pin', 'tap', 'mec', 'rec'];
const OP_LABEL = { fun: 'Funilaria', pin: 'Pintura', tap: 'Tapec./Vidrac.', mec: 'Mecanica', rec: 'Recuperacao' };
const DEFAULT_OPS = { fun: 0, pin: 0, tap: 0, mec: 0, rec: 0 };

function fmt(v) {
  if (typeof v !== 'number' || isNaN(v)) return 'R$ 0,00';
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function partLaborTotal(ops) {
  return OPS.reduce(function(s, k) { return s + (parseFloat((ops || {})[k]) || 0); }, 0) * LABOR_RATE;
}
function partLaborHours(ops) {
  return OPS.reduce(function(s, k) { return s + (parseFloat((ops || {})[k]) || 0); }, 0);
}

const SAMPLES = [
  {
    id: 'onix', label: 'Chevrolet Onix 2021', sub: 'Batida traseira — Tampa e Farol', img: '/samples/onix_rear.jpg',
    vehicle: { brand: 'Chevrolet', model: 'Onix LTZ 1.0 Turbo', year: '2021', color: 'Prata', plate: 'ONX-2021', clientName: 'Lucas Oliveira', fipeValue: 68500 },
    parts: [
      { id: 's1', name: 'Farol Dianteiro Esquerdo', category: 'Iluminacao', actionRequired: 'Substituicao',
        notes: 'Carcaca fraturada e lente quebrada.', box: [20,15,55,55], selectedChoice: 'used',
        ops: { fun: 0, pin: 0.5, tap: 0, mec: 0.5, rec: 0 },
        newPrice: { brandName: 'Original GM Arteb', price: 890, link: 'https://produto.mercadolivre.com.br/MLB-5501296624-farol-led-chevrolet-onix-2020-2021-2022-2023-2024-_JM' },
        usedPrice: { brandName: 'Seminova GM DETRAN', price: 499, link: 'https://produto.mercadolivre.com.br/MLB-5405547970-farol-onix-2020-2021-2022-2023-2024-2025-direito-original-_JM' } },
      { id: 's2', name: 'Tampa Traseira', category: 'Lataria', actionRequired: 'Recuperacao',
        notes: 'Amassado profundo e risco na pintura.', box: [40,25,80,82], selectedChoice: 'repair',
        ops: { fun: 2, pin: 5, tap: 0.5, mec: 0, rec: 0 },
        newPrice: { brandName: 'Servico', price: 0, link: '#' },
        usedPrice: { brandName: 'Servico', price: 0, link: '#' } },
      { id: 's3', name: 'Para-choque Traseiro', category: 'Carroceria', actionRequired: 'Substituicao',
        notes: 'Fissura estrutural — substituicao necessaria.', box: [60,20,90,85], selectedChoice: 'used',
        ops: { fun: 0, pin: 1, tap: 0, mec: 0, rec: 0 },
        newPrice: { brandName: 'Original GM', price: 680, link: 'https://produto.mercadolivre.com.br/MLB-3610996841-parachoque-dianteiro-onix-premier-turbo-2020-2021-2022-2023-_JM' },
        usedPrice: { brandName: 'Seminova DETRAN', price: 380, link: 'https://produto.mercadolivre.com.br/MLB-3482701449-parachoque-dianteiro-chevrolet-onix-2020-2021-2022-original-_JM' } },
    ],
    thirdParty: [{ id: 'tp1', name: 'Alinhamento e balanceamento', value: 180 }]
  },
  {
    id: 'civic', label: 'Honda Civic Touring 2021', sub: 'Colisao frontal — Farol e Para-choque', img: '/samples/civic_front.jpg',
    vehicle: { brand: 'Honda', model: 'Civic Touring 1.5 Turbo', year: '2021', color: 'Prata', plate: 'BRA-2021', clientName: 'Ricardo Silva', fipeValue: 128000 },
    parts: [
      { id: 'c1', name: 'Farol Dianteiro Esquerdo Full LED', category: 'Iluminacao', actionRequired: 'Substituicao',
        notes: 'Lente acrilica e mascara interna destruidas.', box: [15,10,50,45], selectedChoice: 'used',
        ops: { fun: 0, pin: 0.5, tap: 0, mec: 1, rec: 0 },
        newPrice: { brandName: 'Original Honda OEM', price: 2850, link: 'https://produto.mercadolivre.com.br/MLB-3388190019-farol-dianteiro-esquerdo-honda-civic-g10-full-led-2020-2021-_JM' },
        usedPrice: { brandName: 'Seminova Honda DETRAN', price: 1250, link: 'https://produto.mercadolivre.com.br/MLB-3518290112-farol-full-led-honda-civic-g10-2019-2020-2021-original-usado-_JM' } },
      { id: 'c2', name: 'Para-choque Dianteiro', category: 'Carroceria', actionRequired: 'Substituicao',
        notes: 'Rachadura nos encaixes do paralama.', box: [40,20,85,90], selectedChoice: 'used',
        ops: { fun: 0.5, pin: 2, tap: 0, mec: 0, rec: 0 },
        newPrice: { brandName: 'DTS 1a Linha', price: 750, link: 'https://produto.mercadolivre.com.br/MLB-2109820012-parachoque-dianteiro-honda-civic-g10-2020-2021-original-_JM' },
        usedPrice: { brandName: 'Alinhada DETRAN', price: 420, link: 'https://produto.mercadolivre.com.br/MLB-3418290912-parachoque-dianteiro-honda-civic-g10-2021-usado-original-_JM' } },
    ],
    thirdParty: [{ id: 'tp2', name: 'Geometria da direcao', value: 220 }]
  },
  {
    id: 'corolla', label: 'Toyota Corolla XEi 2020', sub: 'Impacto lateral — Porta e Retrovisor', img: '/samples/corolla_side.jpg',
    vehicle: { brand: 'Toyota', model: 'Corolla XEi 2.0 Flex', year: '2020', color: 'Branco Perola', plate: 'TOY-2020', clientName: 'Juliana Costa', fipeValue: 135000 },
    parts: [
      { id: 't1', name: 'Retrovisor Eletrico Direito', category: 'Eletrica', actionRequired: 'Substituicao',
        notes: 'Mecanismo de rebatimento destruido.', box: [25,65,55,90], selectedChoice: 'used',
        ops: { fun: 0, pin: 0.5, tap: 0, mec: 1, rec: 0 },
        newPrice: { brandName: 'Original Toyota OEM', price: 1350, link: 'https://produto.mercadolivre.com.br/MLB-3219080112-retrovisor-eletrico-toyota-corolla-2020-2021-2022-original-_JM' },
        usedPrice: { brandName: 'Seminova Toyota RS', price: 650, link: 'https://produto.mercadolivre.com.br/MLB-3489102911-retrovisor-direito-corolla-2020-2021-original-usado-_JM' } },
      { id: 't2', name: 'Porta Dianteira Direita', category: 'Lataria / Porta', actionRequired: 'Recuperacao',
        notes: 'Amassado profundo e dobracas danificadas.', box: [30,15,80,70], selectedChoice: 'repair',
        ops: { fun: 3, pin: 4, tap: 1, mec: 0.5, rec: 0 },
        newPrice: { brandName: 'Servico', price: 0, link: '#' },
        usedPrice: { brandName: 'Servico', price: 0, link: '#' } },
    ],
    thirdParty: []
  },
];

function App() {
  const [images, setImages] = useState([]);
  const [vehicle, setVehicle] = useState({ brand: '', model: '', year: '', plate: '', color: '', clientName: '', fipeValue: 68500 });
  const [parts, setParts] = useState([]);
  const [thirdParty, setThirdParty] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [apiKey, setApiKey] = useState(null);
  const [showPdf, setShowPdf] = useState(false);
  const [activeTab, setActiveTab] = useState('budget');
  const [osStatus, setOsStatus] = useState('Em Vistoria');
  const [osList, setOsList] = useState(function() {
    try { return JSON.parse(localStorage.getItem('autobudget_os_list') || '[]'); } catch(e) { return []; }
  });
  const fileRef = useRef();

  useEffect(function() {
    fetch('/api/health').then(function(r) { return r.json(); }).then(function(d) { setApiKey(d.geminiKeyConfigured); }).catch(function() { setApiKey(false); });
  }, []);

  const setVField = function(f, v) { setVehicle(function(prev) { return { ...prev, [f]: v }; }); };

  const setPartOp = function(partId, op, val) {
    setParts(function(prev) {
      return prev.map(function(p) {
        if (p.id !== partId) return p;
        return { ...p, ops: { ...(p.ops || DEFAULT_OPS), [op]: parseFloat(val) || 0 } };
      });
    });
  };

  const toggleChoice = function(id, choice) {
    setParts(function(prev) { return prev.map(function(p) { return p.id === id ? { ...p, selectedChoice: p.selectedChoice === choice ? 'repair' : choice } : p; }); });
  };

  const addThirdParty = function() { setThirdParty(function(prev) { return [...prev, { id: 'tp' + Date.now(), name: '', value: 0 }]; }); };
  const removeThirdParty = function(id) { setThirdParty(function(prev) { return prev.filter(function(t) { return t.id !== id; }); }); };
  const setTPField = function(id, field, val) {
    setThirdParty(function(prev) {
      return prev.map(function(t) {
        if (t.id !== id) return t;
        return { ...t, [field]: field === 'value' ? (parseFloat(val) || 0) : val };
      });
    });
  };

  const totalLaborParts = parts.reduce(function(sum, p) { return sum + partLaborTotal(p.ops || DEFAULT_OPS); }, 0);
  const totalThirdPartyVal = thirdParty.reduce(function(sum, t) { return sum + (parseFloat(t.value) || 0); }, 0);
  const totalLabor = totalLaborParts + totalThirdPartyVal;

  let totNew = 0; let totSelected = 0;
  parts.forEach(function(p) {
    totNew += p.newPrice ? (p.newPrice.price || 0) : 0;
    const sp = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price || 0 : 0) :
               p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price || 0 : 0) : 0;
    totSelected += sp;
  });

  const budgetNew = totNew + totalLabor;
  const budgetSel = totSelected + totalLabor;
  const saving = Math.max(0, budgetNew - budgetSel);
  const savingPct = budgetNew > 0 ? ((saving / budgetNew) * 100).toFixed(1) : '0.0';
  const fipeVal = vehicle.fipeValue || 68500;
  const fipePct = ((budgetSel / fipeVal) * 100).toFixed(1);
  const isTotalLoss = parseFloat(fipePct) >= 75.0;

  const processFiles = async function(files) {
    const imgs = [];
    for (const f of Array.from(files)) {
      const blobUrl = URL.createObjectURL(f);
      const b64 = await new Promise(function(resolve) {
        const reader = new FileReader();
        reader.onload = function(e) { resolve(e.target.result.split(',')[1]); };
        reader.readAsDataURL(f);
      });
      imgs.push({ blobUrl, base64: b64, name: f.name });
    }
    setImages(imgs);
  };

  const analyze = async function() {
    if (!images.length || !vehicle.brand) return;
    setLoading(true); setLoadingMsg('Analisando imagens com Gemini AI...');
    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images: images.map(function(i) { return i.base64; }), vehicle })
      });
      if (!resp.ok) throw new Error('Server error: ' + resp.status);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      const enriched = (data.parts || []).map(function(p, i) {
        return { ...p, id: 'p' + Date.now().toString().slice(-6) + i, ops: DEFAULT_OPS, selectedChoice: p.actionRequired === 'Substituicao' ? 'used' : 'repair' };
      });
      setParts(enriched);
      setThirdParty([]);
      setAnalysis({ aiPowered: true });
    } catch(e) {
      alert('Erro na analise: ' + e.message);
    } finally {
      setLoading(false); setLoadingMsg('');
    }
  };

  const loadSample = function(s) {
    setImages([{ blobUrl: s.img, base64: '', name: 'sample.jpg' }]);
    setVehicle({ ...s.vehicle });
    setParts(s.parts.map(function(p) { return { ...p, ops: p.ops || { ...DEFAULT_OPS } }; }));
    setThirdParty(s.thirdParty || []);
    setAnalysis({ aiPowered: false });
  };

  const saveOS = function() {
    const newOs = {
      id: 'OS-' + Date.now().toString().slice(-6),
      date: new Date().toLocaleDateString('pt-BR'),
      vehicle: vehicle.brand + ' ' + vehicle.model,
      plate: vehicle.plate,
      client: vehicle.clientName,
      total: budgetSel,
      fipePct: fipePct,
      isTotalLoss: isTotalLoss,
      status: osStatus
    };
    const updated = [newOs, ...osList].slice(0, 50);
    setOsList(updated);
    localStorage.setItem('autobudget_os_list', JSON.stringify(updated));
    alert('OS ' + newOs.id + ' salva no historico!');
  };

  const shareWhatsApp = function() {
    const pList = parts.map(function(p, i) {
      const v = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price : 0) :
                p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price : 0) : 0;
      const opsDetail = OPS.filter(function(op) { return parseFloat((p.ops || {})[op]) > 0; })
        .map(function(op) { return OP_LABEL[op] + ': ' + (p.ops[op]) + 'h'; }).join(', ');
      return (i + 1) + '. ' + p.name + ' — ' + fmt(v) + (opsDetail ? ' | MO: ' + opsDetail : '');
    }).join('\n');
    const tpList = thirdParty.filter(function(t) { return t.name; })
      .map(function(t) { return '  • ' + t.name + ': ' + fmt(t.value); }).join('\n');
    const lines = [
      '*ORCAMENTO DE REPAROS AUTOMOTIVOS*',
      'Data: ' + new Date().toLocaleDateString('pt-BR'),
      'Veiculo: ' + vehicle.brand + ' ' + vehicle.model + ' (' + vehicle.year + ')',
      'Placa: ' + (vehicle.plate || 'N/I') + ' | Cliente: ' + (vehicle.clientName || 'Cliente'),
      'FIPE: ' + fmt(fipeVal) + ' | Comprometimento: ' + fipePct + '% ' + (isTotalLoss ? '— RISCO PERDA TOTAL' : ''),
      '',
      '*PECAS & COMPONENTES:*',
      pList,
      '',
      '*MAO DE OBRA (R$ 80,00/h)*',
      '  Funilaria + Pintura + Tapec./Vidrac. + Mec. + Rec.: ' + fmt(totalLaborParts),
      (tpList ? '*SERVICOS DE TERCEIROS:*\n' + tpList + '\n  Subtotal: ' + fmt(totalThirdPartyVal) : ''),
      '',
      '*TOTAL DO ORCAMENTO: ' + fmt(budgetSel) + '*',
      'Economia com usadas: ' + fmt(saving) + ' (' + savingPct + '% OFF)',
      '',
      'Status: ' + osStatus,
      '_AutoBudget AI v3.0 — Vistoria Computacional_'
    ].filter(function(l) { return l !== undefined; });
    const msg = lines.join('\n');
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  };

  return (
    <div className='wrap'>

      {/* HEADER */}
      <header className='card' style={{ padding:'18px 26px', marginBottom:22, borderTop:'3px solid var(--gold)', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:14 }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>

                <div style={{ background: isTotalLoss ? 'rgba(244,63,94,.1)' : 'rgba(16,185,129,.08)', borderRadius:10, padding:'14px 16px', border:'1px solid ' + (isTotalLoss ? 'rgba(244,63,94,.4)' : 'rgba(16,185,129,.3)') }}>
                  <div style={{ fontSize:'.72rem', color:'var(--muted)', fontWeight:700, marginBottom:6 }}>% TABELA FIPE</div>
                  <div style={{ fontSize:'1.7rem', fontWeight:900, color: isTotalLoss ? 'var(--rose)' : 'var(--emerald)' }}>{fipePct}%</div>
                  <div style={{ fontSize:'.72rem', color:'var(--dim)' }}>FIPE: {fmt(fipeVal)}</div>
                </div>
              </div>

              {isTotalLoss && (
                <div style={{ background:'rgba(244,63,94,.12)', border:'1px solid rgba(244,63,94,.5)', borderRadius:10, padding:'14px 18px', marginBottom:18, display:'flex', alignItems:'center', gap:12 }}>
                  <span style={{ fontSize:'1.4rem' }}>🚨</span>
                  <div>
                    <div style={{ fontWeight:800, color:'var(--rose)' }}>ALERTA DE PERDA TOTAL</div>
                    <div style={{ fontSize:'.83rem', color:'var(--muted)', marginTop:2 }}>Custo de reparo ({fmt(budgetSel)}) atinge {fipePct}% da Tabela FIPE ({fmt(fipeVal)}). Verifique com a seguradora.</div>
                  </div>
                </div>
              )}

              <div style={{ display:'flex', gap:10, flexWrap:'wrap', alignItems:'center' }}>
                <button className='btn-whatsapp' onClick={shareWhatsApp}>💬 Enviar WhatsApp</button>
                <button className='btn-gold' onClick={function() { setShowPdf(true); }}>📄 Gerar PDF</button>
                <div style={{ marginLeft:'auto', display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}>
                  <select value={osStatus} onChange={function(e) { setOsStatus(e.target.value); }}
                    className='inp' style={{ maxWidth:180, padding:'8px 12px' }}>
                    {['Em Vistoria','Aguardando Pecas','Em Execucao','Concluido','Cancelado'].map(function(s) {
                      return <option key={s} value={s}>{s}</option>;
                    })}
                  </select>
                  <button className='btn-emerald' onClick={saveOS}>💾 Salvar OS</button>
                </div>
              </div>
            </div>
          )}

        </div>
      )}

      {/* PDF MODAL */}
      {showPdf && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.8)', zIndex:999, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }} onClick={function() { setShowPdf(false); }}>
          <div style={{ background:'#fff', color:'#111', borderRadius:14, padding:'32px 36px', maxWidth:800, width:'100%', maxHeight:'90vh', overflowY:'auto' }} onClick={function(e) { e.stopPropagation(); }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:18 }}>
              <h2 style={{ fontFamily:"'Outfit',sans-serif", color:'#1a1a2e', fontSize:'1.2rem', fontWeight:900 }}>AutoBudget AI — Orcamento de Reparos</h2>
              <button onClick={function() { window.print(); }} style={{ background:'#f59e0b', color:'#000', border:'none', padding:'8px 16px', borderRadius:8, cursor:'pointer', fontWeight:700 }}>🖨️ Imprimir</button>
            </div>
            <p style={{ fontSize:'.88rem', color:'#555', marginBottom:4 }}><strong>Veiculo:</strong> {vehicle.brand} {vehicle.model} {vehicle.year} | <strong>Placa:</strong> {vehicle.plate} | <strong>Cor:</strong> {vehicle.color}</p>
            <p style={{ fontSize:'.88rem', color:'#555', marginBottom:4 }}><strong>Cliente:</strong> {vehicle.clientName || 'N/I'} | <strong>Data:</strong> {new Date().toLocaleDateString('pt-BR')}</p>
            <p style={{ fontSize:'.88rem', color:'#555', marginBottom:16 }}><strong>FIPE:</strong> {fmt(fipeVal)} | <strong>Comprometimento:</strong> {fipePct}% {isTotalLoss ? '— RISCO PERDA TOTAL' : ''}</p>
            <hr style={{ borderColor:'#eee', marginBottom:16 }} />
            <h3 style={{ fontSize:'.95rem', fontWeight:800, marginBottom:10 }}>Pecas e Servicos:</h3>
            <table style={{ width:'100%', borderCollapse:'collapse', fontSize:'.82rem', marginBottom:16 }}>
              <thead>
                <tr style={{ background:'#f3f4f6' }}>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Peca</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Fun.</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Pin.</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Tap./Vid.</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Mec.</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Rec.</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>MO</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Peca</th>
                  <th style={{ padding:'7px 10px', textAlign:'left' }}>Total</th>
                </tr>
              </thead>
              <tbody>
                {parts.map(function(p) {
                  const ops = p.ops || DEFAULT_OPS;
                  const mo = partLaborTotal(ops);
                  const pc = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price || 0 : 0) : p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price || 0 : 0) : 0;
                  return (
                    <tr key={p.id} style={{ borderBottom:'1px solid #f0f0f0' }}>
                      <td style={{ padding:'7px 10px', fontWeight:600 }}>{p.name}</td>
                      {OPS.map(function(op) {
                        const h = parseFloat(ops[op]) || 0;
                        return <td key={op} style={{ padding:'7px 10px', color: h > 0 ? '#1a1a2e' : '#ccc' }}>{h > 0 ? h + 'h' : '—'}</td>;
                      })}
                      <td style={{ padding:'7px 10px', fontWeight:700, color:'#7c3aed' }}>{fmt(mo)}</td>
                      <td style={{ padding:'7px 10px' }}>{pc > 0 ? fmt(pc) : '—'}</td>
                      <td style={{ padding:'7px 10px', fontWeight:800 }}>{fmt(mo + pc)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {thirdParty.filter(function(t){return t.name;}).length > 0 && (
              <div style={{ marginBottom:16 }}>
                <h3 style={{ fontSize:'.95rem', fontWeight:800, marginBottom:8 }}>Servicos de Terceiros:</h3>
                {thirdParty.filter(function(t){return t.name;}).map(function(t) {
                  return <div key={t.id} style={{ fontSize:'.85rem', display:'flex', justifyContent:'space-between', padding:'4px 0', borderBottom:'1px solid #f0f0f0' }}><span>{t.name}</span><span style={{ fontWeight:700 }}>{fmt(t.value)}</span></div>;
                })}
              </div>
            )}
            <div style={{ background:'#fef3c7', borderRadius:8, padding:'14px 16px' }}>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:12 }}>
                <div><div style={{ fontSize:'.7rem', color:'#92400e', fontWeight:700 }}>PECAS</div><div style={{ fontWeight:900 }}>{fmt(totSelected)}</div></div>
                <div><div style={{ fontSize:'.7rem', color:'#92400e', fontWeight:700 }}>MAO DE OBRA</div><div style={{ fontWeight:900, color:'#7c3aed' }}>{fmt(totalLaborParts)}</div></div>
                {totalThirdPartyVal > 0 && <div><div style={{ fontSize:'.7rem', color:'#92400e', fontWeight:700 }}>TERCEIROS</div><div style={{ fontWeight:900, color:'#dc2626' }}>{fmt(totalThirdPartyVal)}</div></div>}
                <div><div style={{ fontSize:'.7rem', color:'#92400e', fontWeight:700 }}>TOTAL GERAL</div><div style={{ fontWeight:900, fontSize:'1.1rem', color:'#d97706' }}>{fmt(budgetSel)}</div></div>
              </div>
            </div>
            <p style={{ marginTop:12, fontSize:'.75rem', color:'#999', textAlign:'center' }}>Mao de obra: R$ 80,00/h (taxa fixa, todas as operacoes) | AutoBudget AI v3.0</p>
            <button onClick={function() { setShowPdf(false); }} className='no-print'
              style={{ marginTop:14, background:'#f1f5f9', border:'none', padding:'8px 18px', borderRadius:8, cursor:'pointer', fontWeight:700 }}>Fechar</button>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
