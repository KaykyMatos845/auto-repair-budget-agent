<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <style>

    :root {
      --font-display: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --bg-dark: #070913;
      --card-bg: rgba(14, 20, 36, 0.88);
      --card-bg-hover: rgba(18, 26, 46, 0.95);
      --card-inner: rgba(8, 12, 22, 0.75);
      
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(245, 158, 11, 0.35);
      --border-accent-hi: #f59e0b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --gold-glow: rgba(245, 158, 11, 0.15);
      
      --violet: #8b5cf6;
      --violet-light: #a78bfa;
      --violet-glow: rgba(139, 92, 246, 0.15);
      
      --emerald: #10b981;
      --emerald-light: #34d399;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      
      --rose: #f43f5e;
      --rose-light: #fb7185;
      --rose-glow: rgba(244, 63, 94, 0.15);
      
      --cyan: #06b6d4;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
      
      --shadow-card: 0 12px 36px -4px rgba(0, 0, 0, 0.6);
      --shadow-glow: 0 0 30px rgba(245, 158, 11, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 15%, rgba(139, 92, 246, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }

    h1, h2, h3, h4 { font-family: var(--font-display); letter-spacing: -0.02em; }
    
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* Cards */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: all 0.25s ease;
    }
    .glass-panel:hover {
      border-color: rgba(255, 255, 255, 0.12);
    }

    /* Buttons */
    .btn {
      font-family: var(--font-body);
      font-weight: 700;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-size: 0.86rem;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    
    .btn-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      color: #090d16;
      box-shadow: 0 4px 18px rgba(245, 158, 11, 0.3);
    }
    .btn-gold:hover { filter: brightness(1.12); transform: translateY(-1px); }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-whatsapp {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.3);
    }
    .btn-whatsapp:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-emerald {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.25);
    }
    .btn-emerald:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: var(--border-accent);
      color: var(--gold-light);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .badge-replace { background: var(--rose-glow); color: var(--rose-light); border: 1px solid rgba(244,63,94,0.35); }
    .badge-repair  { background: var(--gold-glow); color: var(--gold-light); border: 1px solid rgba(245,158,11,0.35); }
    .badge-new     { background: var(--violet-glow); color: var(--violet-light); border: 1px solid rgba(139,92,246,0.35); }
    .badge-used    { background: var(--emerald-glow); color: var(--emerald-light); border: 1px solid rgba(16,185,129,0.35); }
    .badge-ai      { background: rgba(6,182,212,0.15); color: var(--cyan); border: 1px solid rgba(6,182,212,0.35); }

    /* Inputs */
    .form-inp {
      width: 100%;
      padding: 10px 14px;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: var(--font-body);
      outline: none;
      transition: all 0.2s;
    }
    .form-inp:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }
    .form-label {
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* FIPE & Loss Bar */
    .fipe-card {
      background: linear-gradient(135deg, rgba(14,20,36,0.95) 0%, rgba(20,28,52,0.95) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 26px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }
    .fipe-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 5px;
      background: var(--gold);
    }
    .fipe-card.total-loss::before {
      background: var(--rose);
    }

    /* Part Card Design */
    .part-card {
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .part-card:hover {
      border-color: rgba(245, 158, 11, 0.25);
    }

    .part-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .part-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .part-category {
      font-size: 0.78rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .part-notes {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .part-summary-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: right;
    }

    /* Operations Grid */
    .ops-section-title {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ops-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    @media (max-width: 900px) {
      .ops-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 580px) {
      .ops-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .op-cell {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-sm);
      padding: 10px 10px 8px;
      text-align: center;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .op-cell.has-hours {
      background: rgba(245, 158, 11, 0.06);
      border-color: rgba(245, 158, 11, 0.35);
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.08);
    }

    .op-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .op-cell.has-hours .op-header {
      color: var(--gold-light);
    }

    .op-stepper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 4px;
    }
    .op-cell.has-hours .op-stepper {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(0, 0, 0, 0.5);
    }

    .op-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .op-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .op-num-input {
      width: 38px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      outline: none;
      -moz-appearance: textfield;
    }
    .op-num-input::-webkit-outer-spin-button,
    .op-num-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .op-cell.has-hours .op-num-input {
      color: var(--gold-light);
    }

    .op-unit {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 600;
      padding-right: 2px;
    }

    .op-subtotal {
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 6px;
      font-family: var(--font-mono);
    }
    .op-subtotal.zero {
      color: var(--text-dim);
      font-weight: 400;
    }
    .op-subtotal.active {
      color: var(--emerald-light);
    }

    /* Price choices (Nova vs Usada) */
    .pricing-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    @media (max-width: 650px) {
      .pricing-grid { grid-template-columns: 1fr; }
    }

    .price-option-card {
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      position: relative;
    }
    .price-option-card:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .price-option-card.selected-new {
      background: rgba(139, 92, 246, 0.12);
      border: 2px solid var(--violet);
      box-shadow: 0 0 16px rgba(139, 92, 246, 0.2);
    }
    .price-option-card.selected-used {
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid var(--emerald);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.2);
    }

    .price-option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .price-val {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-main);
    }
    .price-brand {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .ml-link {
      font-size: 0.74rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .ml-link:hover { text-decoration: underline; opacity: 0.85; }

    /* Tables */
    .tbl-custom {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .tbl-custom th {
      padding: 10px 12px;
      text-align: left;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }
    .tbl-custom td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      vertical-align: middle;
    }
    .tbl-custom tr:hover td {
      background: rgba(245, 158, 11, 0.03);
    }

    /* Upload & Image Box */
    .upload-box {
      border: 2px dashed rgba(245, 158, 11, 0.3);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      background: rgba(10, 14, 26, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .upload-box:hover {
      border-color: var(--gold);
      background: rgba(245, 158, 11, 0.05);
    }
    .img-box-container {
      position: relative;
      display: inline-block;
      overflow: hidden;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-accent);
    }
    .bbox-overlay {
      position: absolute;
      border: 2px solid #f43f5e;
      background: rgba(244, 63, 94, 0.25);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.7);
      pointer-events: none;
    }
    .bbox-label {
      position: absolute;
      top: -22px; left: -2px;
      background: #f43f5e;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px 4px 4px 0;
      white-space: nowrap;
    }

    /* Print / PDF Mode */
    @media print {
      body * { visibility: hidden; }
      #pdf-area, #pdf-area * { visibility: visible; }
      #pdf-area {
        position: absolute; left: 0; top: 0; width: 100%;
        background: #fff !important; color: #111 !important;
      }
      .no-print { display: none !important; }
    }

  </style>
</head>

    vehicle: { brand: 'Toyota', model: 'Corolla XEi 2.0 Flex', year: '2020', color: 'Branco Pérola', plate: 'TOY-2020', clientName: 'Juliana Costa', fipeValue: 135000 },
    parts: [
      {

        actionRequired: 'Substituição',
        side: 'Direito',

        box: [25, 65, 55, 90],

        newPrice: {

        },

          compatibility: 'Lado Direito • Desmanche Credenciado DETRAN • Em Estoque'
        }
      },
      {
        id: 't2',
        name: 'Porta Dianteira Direita (Passageiro)',
        category: 'Lataria / Porta',
        actionRequired: 'Recuperação',
        side: 'Direito',
        position: 'Lateral',
        notes: 'Amassado na folha externa e recuperação de dobradiça.',
        box: [30, 15, 80, 70],
        selectedChoice: 'repair',
        ops: { fun: 3, pin: 4, tap: 1, mec: 0.5, rec: 0 },
        newPrice: { brandName: 'Serviço de Recuperação', price: 0, link: '#' },
        usedPrice: { brandName: 'Serviço de Recuperação', price: 0, link: '#' }
      }
    ],
    thirdParty: []
  }
];

function App() {
  const [images, setImages] = useState([]);
  const [vehicle, setVehicle] = useState({ brand: '', model: '', year: '', plate: '', color: '', clientName: '', fipeValue: 68500 });
  const [parts, setParts] = useState([]);
  const [thirdParty, setThirdParty] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [apiKey, setApiKey] = useState(null);
  const [showPdf, setShowPdf] = useState(false);
  const [activeTab, setActiveTab] = useState('budget');
  const [osStatus, setOsStatus] = useState('Em Vistoria');
  const [osList, setOsList] = useState(() => {
    try { return JSON.parse(localStorage.getItem('autobudget_os_list') || '[]'); } catch(e) { return []; }
  });
  const fileRef = useRef();

  useEffect(() => {
    fetch('/api/health')
      .then(r => r.json())
      .then(d => setApiKey(d.geminiKeyConfigured))
      .catch(() => setApiKey(false));
  }, []);

  const setVField = (field, value) => {
    setVehicle(prev => ({ ...prev, [field]: value }));
  };

  const setPartOp = (partId, opId, val) => {
    const num = Math.max(0, parseFloat(val) || 0);
    setParts(prev => prev.map(p => {
      if (p.id !== partId) return p;
      return { ...p, ops: { ...(p.ops || DEFAULT_OPS), [opId]: num } };
    }));
  };

  const stepPartOp = (partId, opId, delta) => {
    setParts(prev => prev.map(p => {
      if (p.id !== partId) return p;
      const current = parseFloat((p.ops || {})[opId]) || 0;
      const next = Math.max(0, parseFloat((current + delta).toFixed(1)));
      return { ...p, ops: { ...(p.ops || DEFAULT_OPS), [opId]: next } };
    }));
  };

  const toggleChoice = (partId, choice) => {
    setParts(prev => prev.map(p => {
      if (p.id !== partId) return p;
      return { ...p, selectedChoice: p.selectedChoice === choice ? 'repair' : choice };
    }));
  };

  const addThirdParty = () => {
    setThirdParty(prev => [...prev, { id: 'tp' + Date.now(), name: '', value: 0 }]);
  };
  const removeThirdParty = (id) => {
    setThirdParty(prev => prev.filter(t => t.id !== id));
  };
  const setTPField = (id, field, val) => {
    setThirdParty(prev => prev.map(t => {
      if (t.id !== id) return t;
      return { ...t, [field]: field === 'value' ? (Math.max(0, parseFloat(val) || 0)) : val };
    }));
  };

  const totalLaborParts = parts.reduce((sum, p) => sum + partLaborTotal(p.ops || DEFAULT_OPS), 0);
  const totalThirdPartyVal = thirdParty.reduce((sum, t) => sum + (parseFloat(t.value) || 0), 0);
  const totalLabor = totalLaborParts + totalThirdPartyVal;

  let totNew = 0;
  let totSelected = 0;
  parts.forEach(p => {
    totNew += p.newPrice ? (p.newPrice.price || 0) : 0;
    const sp = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price || 0 : 0) :
               p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price || 0 : 0) : 0;
    totSelected += sp;
  });

  const budgetNew = totNew + totalLabor;
  const budgetSel = totSelected + totalLabor;
  const saving = Math.max(0, budgetNew - budgetSel);
  const savingPct = budgetNew > 0 ? ((saving / budgetNew) * 100).toFixed(1) : '0.0';
  const fipeVal = vehicle.fipeValue || 68500;
  const fipePct = ((budgetSel / fipeVal) * 100).toFixed(1);
  const isTotalLoss = parseFloat(fipePct) >= 75.0;

  const processFiles = async (files) => {
    const imgs = [];
    for (const f of Array.from(files)) {
      const blobUrl = URL.createObjectURL(f);
      const b64 = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result.split(',')[1]);
        reader.readAsDataURL(f);
      });
      imgs.push({ blobUrl, base64: b64, name: f.name });
    }
    setImages(imgs);
  };

  const analyze = async () => {
    if (!images.length || !vehicle.brand) return;
    setLoading(true);
    setLoadingMsg('Analisando imagens e precificando peças via IA...');
    try {
      const resp = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images: images.map(i => i.base64), vehicle })
      });
      if (!resp.ok) throw new Error('Falha no servidor: ' + resp.status);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);
      const enriched = (data.parts || []).map((p, i) => ({
        ...p,
        id: 'p' + Date.now().toString().slice(-6) + i,
        ops: { fun: 0, pin: 0, tap: 0, mec: 0, rec: 0 },
        selectedChoice: p.actionRequired === 'Substituição' ? 'used' : 'repair'
      }));
      setParts(enriched);
      setThirdParty([]);
      setAnalysis({ aiPowered: true });
    } catch(e) {
      alert('Erro na análise: ' + e.message);
    } finally {
      setLoading(false);
      setLoadingMsg('');
    }
  };

  const loadSample = (s) => {
    setImages([{ blobUrl: s.img, base64: '', name: 'sample.jpg' }]);
    setVehicle({ ...s.vehicle });
    setParts(s.parts.map(p => ({ ...p, ops: p.ops || { ...DEFAULT_OPS } })));
    setThirdParty(s.thirdParty || []);
    setAnalysis({ aiPowered: false });
  };

  const saveOS = () => {
    const newOs = {
      id: 'OS-' + Date.now().toString().slice(-6),
      date: new Date().toLocaleDateString('pt-BR'),
      vehicle: vehicle.brand + ' ' + vehicle.model,
      plate: vehicle.plate,
      client: vehicle.clientName,
      total: budgetSel,
      fipePct: fipePct,
      isTotalLoss: isTotalLoss,
      status: osStatus
    };
    const updated = [newOs, ...osList].slice(0, 50);
    setOsList(updated);
    localStorage.setItem('autobudget_os_list', JSON.stringify(updated));
    alert('✅ Ordem de Serviço ' + newOs.id + ' salva com sucesso!');
  };

  const shareWhatsApp = () => {
    const pList = parts.map((p, i) => {
      const v = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price : 0) :
                p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price : 0) : 0;
      const opsDetail = OPS.filter(op => parseFloat((p.ops || {})[op.id]) > 0)
        .map(op => op.label + ': ' + p.ops[op.id] + 'h').join(', ');
      return (i + 1) + '. ' + p.name + ' — ' + fmt(v) + (opsDetail ? ' | MO: ' + opsDetail : '');
    }).join('\n');

    const tpList = thirdParty.filter(t => t.name)
      .map(t => '  • ' + t.name + ': ' + fmt(t.value)).join('\n');

    const lines = [
      '🏎️ *ORÇAMENTO DE REPAROS AUTOMOTIVOS*',
      '📅 Data: ' + new Date().toLocaleDateString('pt-BR'),
      '🚗 Veículo: ' + vehicle.brand + ' ' + vehicle.model + ' (' + vehicle.year + ')',
      '🏷️ Placa: ' + (vehicle.plate || 'N/I') + ' | Cliente: ' + (vehicle.clientName || 'Cliente'),
      '📊 FIPE: ' + fmt(fipeVal) + ' | Comprometimento: ' + fipePct + '% ' + (isTotalLoss ? '🚨 RISCO PERDA TOTAL' : ''),
      '',
      '📋 *PEÇAS & COMPONENTES:*',
      pList,
      '',
      '🔧 *MÃO DE OBRA (Taxa linear R$ 80,00/h):*',
      '  Subtotal Operações: ' + fmt(totalLaborParts),
      (tpList ? '\n🔗 *SERVIÇOS DE TERCEIROS:*\n' + tpList + '\n  Subtotal: ' + fmt(totalThirdPartyVal) : ''),
      '',
      '💰 *TOTAL GERAL: ' + fmt(budgetSel) + '*',
      '🎉 Economia estimada: ' + fmt(saving) + ' (' + savingPct + '% OFF)',
      '',
      'Status: ' + osStatus,
      '_AutoBudget AI v3.0 — Vistoria Computacional_'
    ].filter(l => l !== undefined);

    const msg = lines.join('\n');
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  };

  return (
    <div className="wrap">
      
      {/* HEADER */}
      <header className="glass-panel" style={{ padding: '18px 24px', marginBottom: 22, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 44, height: 44, borderRadius: 12, background: 'linear-gradient(135deg, #fbbf24 0%, #d97706 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1.4rem', boxShadow: '0 4px 16px rgba(245, 158, 11, 0.3)' }}>🏎️</div>
          <div>
            <h1 style={{ fontSize: '1.25rem', fontWeight: 900, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ background: 'linear-gradient(135deg, #fbbf24, #f43f5e, #8b5cf6)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>AutoBudget AI</span>
              <span style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-dim)', background: 'rgba(255,255,255,0.06)', padding: '2px 8px', borderRadius: 4 }}>v3.0 PRO</span>
            </h1>
            <p style={{ color: 'var(--text-muted)', fontSize: '0.78rem' }}>
              Vistoria Computacional • Mão de Obra R$ 80,00/h fixo • FIPE Integrada • Peças Mercado Livre
            </p>
          </div>
        </div>
        
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <button className="btn btn-ghost" onClick={() => setActiveTab(activeTab === 'history' ? 'budget' : 'history')}>
            📋 Histórico ({osList.length})
          </button>
          {apiKey === false && <span className="badge" style={{ background: 'rgba(244,63,94,0.12)', color: 'var(--rose-light)', border: '1px solid rgba(244,63,94,0.3)' }}>⚠️ Sem API Key</span>}
          {apiKey === true && <span className="badge badge-ai">✨ Gemini AI Ativo</span>}
        </div>
      </header>

      {/* FIPE & BUDGET SUMMARY BAR */}
      {parts.length > 0 && (
        <div className={'fipe-card' + (isTotalLoss ? ' total-loss' : '')}>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 24, alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', gap: 20, alignItems: 'center', flexWrap: 'wrap' }}>
              <div>
                <label className="form-label" style={{ color: 'var(--gold-light)' }}>VALOR TABELA FIPE (MANUAL)</label>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                  <span style={{ color: 'var(--text-muted)', fontWeight: 700, fontSize: '0.9rem' }}>R$</span>
                  <input
                    type="number"
                    className="form-inp"
                    value={vehicle.fipeValue || 68500}
                    onChange={e => setVField('fipeValue', parseFloat(e.target.value) || 0)}
                    style={{ width: 140, fontWeight: 800, fontSize: '1.05rem', color: '#fff', padding: '6px 12px' }}
                  />
                </div>
              </div>

              <div style={{ borderLeft: '1px solid var(--border)', paddingLeft: 20 }}>
                <div className="form-label">Peças Selecionadas</div>
                <div style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--text-main)' }}>{fmt(totSelected)}</div>
              </div>

              <div style={{ borderLeft: '1px solid var(--border)', paddingLeft: 20 }}>
                <div className="form-label">M.O. + Terceiros</div>
                <div style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--violet-light)' }}>{fmt(totalLabor)}</div>
              </div>

              <div style={{ borderLeft: '1px solid var(--border)', paddingLeft: 20 }}>
                <div className="form-label">Total Orçamento</div>
                <div style={{ fontSize: '1.45rem', fontWeight: 900, color: 'var(--gold-light)' }}>{fmt(budgetSel)}</div>
              </div>

              <div style={{ borderLeft: '1px solid var(--border)', paddingLeft: 20 }}>
                <div className="form-label">% da FIPE</div>
                <div style={{ fontSize: '1.45rem', fontWeight: 900, color: isTotalLoss ? 'var(--rose-light)' : 'var(--emerald-light)' }}>
                  {fipePct}%
                </div>
              </div>
            </div>

            {isTotalLoss && (
              <div style={{ background: 'rgba(244,63,94,0.18)', border: '1px solid var(--rose)', borderRadius: 'var(--radius-sm)', padding: '8px 16px', color: 'var(--rose-light)', fontWeight: 800, fontSize: '0.84rem', display: 'flex', alignItems: 'center', gap: 8 }}>
                <span>🚨</span> ALERTA DE PERDA TOTAL (Atinge {'>'} 75% da FIPE)
              </div>
            )}
          </div>
        </div>
      )}

      {/* TAB: OS HISTORY */}
      {activeTab === 'history' && (
        <div className="glass-panel" style={{ padding: 24, marginBottom: 24 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
            <h2 style={{ fontSize: '1.1rem', fontWeight: 800 }}>📋 Histórico de Ordens de Serviço</h2>
            <button className="btn btn-ghost" onClick={() => setActiveTab('budget')}>← Voltar ao Orçamento</button>
          </div>
          {osList.length === 0 ? (
            <p style={{ color: 'var(--text-dim)', textAlign: 'center', padding: 40 }}>Nenhuma OS salva ainda.</p>
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table className="tbl-custom">
                <thead>
                  <tr>
                    <th>Nº OS</th>
                    <th>Data</th>
                    <th>Veículo</th>
                    <th>Placa</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>% FIPE</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {osList.map(os => (
                    <tr key={os.id}>
                      <td style={{ fontWeight: 800, color: 'var(--gold-light)' }}>{os.id}</td>
                      <td>{os.date}</td>
                      <td>{os.vehicle}</td>
                      <td><code style={{ background: 'rgba(255,255,255,0.06)', padding: '2px 6px', borderRadius: 4 }}>{os.plate}</code></td>
                      <td>{os.client || '—'}</td>
                      <td style={{ fontWeight: 800 }}>{fmt(os.total)}</td>
                      <td style={{ fontWeight: 800, color: parseFloat(os.fipePct) >= 75 ? 'var(--rose-light)' : 'var(--emerald-light)' }}>{os.fipePct}%</td>
                      <td><span className="badge badge-repair">{os.status}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {/* TAB: MAIN BUDGET VIEW */}
      {activeTab === 'budget' && (
        <div>

          {/* 1. SAMPLES PRESETS */}
          <div className="glass-panel" style={{ padding: '18px 22px', marginBottom: 20 }}>
            <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 12 }}>
              ⚡ Carregar Vistoria Rápida de Exemplo
            </div>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
              {SAMPLES.map(s => (
                <button
                  key={s.id}
                  className="btn btn-ghost"
                  onClick={() => loadSample(s)}
                  style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', padding: '10px 16px', gap: 2 }}
                >
                  <span style={{ fontWeight: 800, fontSize: '0.88rem', color: 'var(--text-main)' }}>{s.label}</span>
                  <span style={{ fontSize: '0.72rem', color: 'var(--text-dim)' }}>{s.sub}</span>
                </button>
              ))}
            </div>
          </div>

          {/* 2. PHOTOS UPLOAD */}
          <div className="glass-panel" style={{ padding: '20px 24px', marginBottom: 20 }}>
            <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 12 }}>
              📷 Fotos da Avaria / Vistoria
            </div>
            
            <div
              className="upload-box"
              onClick={() => fileRef.current.click()}
              onDragOver={e => e.preventDefault()}
              onDrop={e => { e.preventDefault(); processFiles(e.dataTransfer.files); }}
            >
              <div style={{ fontSize: '2.2rem', marginBottom: 6 }}>📸</div>
              <div style={{ fontWeight: 800, fontSize: '0.95rem', marginBottom: 4 }}>Arraste as fotos do veículo avariado aqui ou clique para selecionar</div>
              <div style={{ fontSize: '0.78rem', color: 'var(--text-muted)' }}>Formatos suportados: JPG, PNG, WEBP (Várias fotos simultâneas)</div>
              <input ref={fileRef} type="file" multiple accept="image/*" style={{ display: 'none' }} onChange={e => processFiles(e.target.files)} />
            </div>

            {images.length > 0 && (
              <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap', marginTop: 16 }}>
                {images.map((img, idx) => (
                  <div key={idx} className="img-box-container" style={{ maxWidth: 220 }}>
                    <img src={img.blobUrl} style={{ width: '100%', display: 'block' }} alt={'Foto ' + (idx + 1)} />
                    {parts.filter(p => p.box).map((p, pi) => {
                      const [x1, y1, x2, y2] = p.box;
                      return (
                        <div key={p.id} className="bbox-overlay" style={{ left: x1 + '%', top: y1 + '%', width: (x2 - x1) + '%', height: (y2 - y1) + '%' }}>
                          <span className="bbox-label">#{pi + 1}</span>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* 3. VEHICLE DATA */}
          <div className="glass-panel" style={{ padding: '20px 24px', marginBottom: 20 }}>
            <div style={{ fontSize: '0.78rem', fontWeight: 700, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 14 }}>
              🚗 Dados do Veículo & Cliente
            </div>
            
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(160px, 1fr))', gap: 12 }}>
              {[
                ['brand', 'Marca', 'Ex: Chevrolet'],
                ['model', 'Modelo', 'Ex: Onix LTZ 1.0'],
                ['year', 'Ano', 'Ex: 2021'],
                ['plate', 'Placa', 'Ex: ABC-1234'],
                ['color', 'Cor', 'Ex: Prata'],
                ['clientName', 'Cliente', 'Ex: Lucas Oliveira']
              ].map(([key, label, placeholder]) => (
                <div key={key}>
                  <label className="form-label">{label}</label>
                  <input
                    className="form-inp"
                    placeholder={placeholder}
                    value={vehicle[key] || ''}
                    onChange={e => setVField(key, e.target.value)}
                  />
                </div>
              ))}
              
              <div>
                <label className="form-label" style={{ color: 'var(--gold-light)' }}>Valor FIPE (R$)</label>
                <input
                  type="number"
                  className="form-inp"
                  placeholder="68500"
                  value={vehicle.fipeValue || 68500}
                  onChange={e => setVField('fipeValue', parseFloat(e.target.value) || 0)}
                  style={{ fontWeight: 800, color: 'var(--gold-light)' }}
                />
              </div>
            </div>

            <div style={{ marginTop: 16, display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
              <button
                className="btn btn-gold"
                disabled={!images.length || !vehicle.brand || loading}
                onClick={analyze}

              <div>
                <h2 style={{ fontFamily: "'Outfit', sans-serif", color: '#0f172a', fontSize: '1.3rem', fontWeight: 900 }}>
                  AutoBudget AI — Laudo & Orçamento de Reparos
                </h2>
                <p style={{ fontSize: '0.8rem', color: '#64748b' }}>Documento de Vistoria Técnica e Precificação</p>
              </div>
              <button
                onClick={() => window.print()}
                style={{ background: '#f59e0b', color: '#000', border: 'none', padding: '9px 18px', borderRadius: 8, cursor: 'pointer', fontWeight: 800 }}
              >
                🖨️ Imprimir Laudo
              </button>
            </div>

            <div style={{ background: '#f8fafc', padding: 14, borderRadius: 8, marginBottom: 18, fontSize: '0.86rem', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
              <div><strong>Veículo:</strong> {vehicle.brand} {vehicle.model} ({vehicle.year})</div>
              <div><strong>Placa:</strong> {vehicle.plate || 'N/I'} • <strong>Cor:</strong> {vehicle.color || 'N/I'}</div>
              <div><strong>Cliente:</strong> {vehicle.clientName || 'N/I'}</div>
              <div><strong>Data:</strong> {new Date().toLocaleDateString('pt-BR')}</div>
              <div><strong>Valor FIPE:</strong> {fmt(fipeVal)}</div>
              <div><strong>Comprometimento:</strong> {fipePct}% {isTotalLoss ? '(🚨 RISCO PERDA TOTAL)' : ''}</div>
            </div>

            <h3 style={{ fontSize: '0.95rem', fontWeight: 800, marginBottom: 10, color: '#0f172a' }}>Demonstrativo por Peça e Especialidade:</h3>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.82rem', marginBottom: 18 }}>
              <thead>
                <tr style={{ background: '#f1f5f9', borderBottom: '2px solid #cbd5e1' }}>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Item</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Funilaria</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Pintura</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Tapeç./Vid.</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Mecânica</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Recup.</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>M.O. Total</th>
                  <th style={{ padding: '8px 10px', textAlign: 'left' }}>Peça</th>
                  <th style={{ padding: '8px 10px', textAlign: 'right' }}>Total Item</th>
                </tr>
              </thead>
              <tbody>
                {parts.map(p => {
                  const ops = p.ops || DEFAULT_OPS;
                  const mo = partLaborTotal(ops);
                  const pc = p.selectedChoice === 'new' ? (p.newPrice ? p.newPrice.price || 0 : 0) :
                             p.selectedChoice === 'used' ? (p.usedPrice ? p.usedPrice.price || 0 : 0) : 0;
                  return (
                    <tr key={p.id} style={{ borderBottom: '1px solid #e2e8f0' }}>
                      <td style={{ padding: '8px 10px', fontWeight: 700 }}>{p.name}</td>
                      {OPS.map(op => {
                        const h = parseFloat(ops[op.id]) || 0;
                        return (
                          <td key={op.id} style={{ padding: '8px 10px', color: h > 0 ? '#0f172a' : '#94a3b8' }}>
                            {h > 0 ? (h + 'h') : '—'}
                          </td>
                        );
                      })}
                      <td style={{ padding: '8px 10px', fontWeight: 700, color: '#7c3aed' }}>{fmt(mo)}</td>
                      <td style={{ padding: '8px 10px' }}>{pc > 0 ? fmt(pc) : '—'}</td>
                      <td style={{ padding: '8px 10px', fontWeight: 900, textAlign: 'right' }}>{fmt(mo + pc)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>

            {thirdParty.filter(t => t.name).length > 0 && (
              <div style={{ marginBottom: 18 }}>
                <h3 style={{ fontSize: '0.95rem', fontWeight: 800, marginBottom: 8, color: '#0f172a' }}>Serviços de Terceiros:</h3>
                {thirdParty.filter(t => t.name).map(t => (
                  <div key={t.id} style={{ fontSize: '0.85rem', display: 'flex', justifyContent: 'space-between', padding: '5px 0', borderBottom: '1px solid #f1f5f9' }}>
                    <span>{t.name}</span>
                    <strong style={{ color: '#dc2626' }}>{fmt(t.value)}</strong>
                  </div>
                ))}
              </div>
            )}

            <div style={{ background: '#fef3c7', borderRadius: 8, padding: '16px 20px', border: '1px solid #fde68a' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr 1fr', gap: 14 }}>
                <div>
                  <div style={{ fontSize: '0.72rem', color: '#92400e', fontWeight: 700 }}>PEÇAS</div>
                  <div style={{ fontWeight: 900, fontSize: '1.1rem', color: '#0f172a' }}>{fmt(totSelected)}</div>
                </div>
                <div>
                  <div style={{ fontSize: '0.72rem', color: '#92400e', fontWeight: 700 }}>MÃO DE OBRA</div>
                  <div style={{ fontWeight: 900, fontSize: '1.1rem', color: '#7c3aed' }}>{fmt(totalLaborParts)}</div>
                </div>
                {totalThirdPartyVal > 0 && (
                  <div>
                    <div style={{ fontSize: '0.72rem', color: '#92400e', fontWeight: 700 }}>TERCEIROS</div>
                    <div style={{ fontWeight: 900, fontSize: '1.1rem', color: '#dc2626' }}>{fmt(totalThirdPartyVal)}</div>
                  </div>
                )}
                <div>
                  <div style={{ fontSize: '0.72rem', color: '#92400e', fontWeight: 700 }}>TOTAL GERAL</div>
                  <div style={{ fontWeight: 900, fontSize: '1.3rem', color: '#d97706' }}>{fmt(budgetSel)}</div>
                </div>
              </div>
            </div>

            <p style={{ marginTop: 16, fontSize: '0.75rem', color: '#94a3b8', textAlign: 'center' }}>
              Mão de Obra tabelada: R$ 80,00/hora em todas as operações • AutoBudget AI v3.0
            </p>

            <button
              onClick={() => setShowPdf(false)}
              className="no-print"
              style={{ marginTop: 14, background: '#f1f5f9', border: 'none', padding: '8px 20px', borderRadius: 8, cursor: 'pointer', fontWeight: 700 }}
            >
              Fechar
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
