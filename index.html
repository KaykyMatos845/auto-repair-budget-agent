    /* Input */
    .inp {
      width: 100%;

    @media print {

<script type="text/babel">

  corolla: { retrovisor:{n:1350,u:650}, porta:{n:1850,u:890}, paralama:{n:480,u:260}, farol:{n:1950,u:880} },
  geral: { farol:{n:980,u:480}, lanterna:{n:700,u:340}, 'para-choque':{n:650,u:320}, porta:{n:1500,u:720}, retrovisor:{n:620,u:300}, capô:{n:1400,u:650}, capo:{n:1400,u:650}, paralama:{n:480,u:240}, vidro:{n:550,u:270}, grade:{n:420,u:210}, 'para-brisa':{n:850,u:420}, parabrisa:{n:850,u:420}, radiador:{n:900,u:420}, longarina:{n:2200,u:1100}, suspensão:{n:1200,u:580}, roda:{n:650,u:280}, airbag:{n:2200,u:950}, 'air bag':{n:2200,u:950} },
};

function getPrices(brand='', model='', partName='') {
  const ml = model.toLowerCase();
  const pl = partName.toLowerCase();
  const key = ml.includes('onix')||ml.includes('prisma') ? 'onix'
             : ml.includes('civic')||ml.includes('fit') ? 'civic'
             : ml.includes('corolla')||ml.includes('hilux') ? 'corolla'
             : 'geral';
  const table = { ...MARKET_PRICES.geral, ...MARKET_PRICES[key] };
  let priceNew = 950, priceUsed = 480;
  for (const k of Object.keys(table)) {
    if (pl.includes(k)) { priceNew = table[k].n; priceUsed = table[k].u; break; }
  }
  const q = encodeURIComponent(`${brand} ${model} ${partName}`);
  return {
    newPrice: { brandName: `Original ${brand} OEM`, price: priceNew, supplier: 'Concessionária / Distribuidoras', link: `https://lista.mercadolivre.com.br/${q}+novo` },
    usedPrice: { brandName: `Seminova ${brand} DETRAN`, price: priceUsed, supplier: 'CDV / Desmanche Credenciado DETRAN', link: `https://lista.mercadolivre.com.br/${q}+usado+original` }
  };
}

function fmt(v) {
  if (typeof v !== 'number' || isNaN(v)) return 'R$ 0,00';
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

// Convert blob URL → base64 string
async function blobToBase64(blobUrl) {
  const resp = await fetch(blobUrl);
  const blob = await resp.blob();
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onloadend = () => res(reader.result.replace(/^data:[^;]+;base64,/, ''));
    reader.onerror = rej;
    reader.readAsDataURL(blob);
  });
}

// ── Sample Cases ───────────────────────────────────────────────────────────────
const SAMPLES = [
  {
    id: 'onix-front', label: 'Chevrolet Onix 2021', sub: 'Batida frontal — farol esquerdo e para-choque', img: '/samples/onix_rear.jpg',
    vehicle: { brand:'Chevrolet', model:'Onix LTZ 1.0 Turbo', year:'2021', color:'Prata', plate:'ONX-2021', clientName:'Lucas Oliveira' },
    parts: [
      { id:'s1', name:'Farol Dianteiro Esquerdo', category:'Iluminação', actionRequired:'Substituição', severity:'Alto', confidence:0.98, notes:'Carcaça fraturada e lente quebrada.', selectedChoice:'used', newPrice:{brandName:'Original GM Arteb',price:890,supplier:'Concessionária GM',link:'https://lista.mercadolivre.com.br/farol+onix+2021+novo'}, usedPrice:{brandName:'Seminova GM DETRAN',price:499,supplier:'CDV Desmanche Credenciado SP',link:'https://lista.mercadolivre.com.br/farol+onix+2021+usado'} },
      { id:'s2', name:'Para-choque Dianteiro com Grade', category:'Carroceria Frontal', actionRequired:'Substituição', severity:'Alto', confidence:0.95, notes:'Fissura estrutural e suportes quebrados.', selectedChoice:'used', newPrice:{brandName:'Original GM sem Pintura',price:680,supplier:'GM Peças Online',link:'https://lista.mercadolivre.com.br/parachoque+onix+2021+novo'}, usedPrice:{brandName:'Seminova GM DETRAN',price:380,supplier:'Recuperadora Sucatas BR',link:'https://lista.mercadolivre.com.br/parachoque+onix+2021+usado'} },
      { id:'s3', name:'Capô Dianteiro (Desamassamento)', category:'Lataria', actionRequired:'Recuperação', severity:'Médio', confidence:0.88, notes:'Vinco na borda esquerda — recuperável com funilaria.', selectedChoice:'repair', newPrice:{brandName:'Serviço Funilaria',price:0,supplier:'Oficina',link:'#'}, usedPrice:{brandName:'Serviço Funilaria',price:0,supplier:'Oficina',link:'#'} },
    ],
    labor: { bodyworkHours:7, bodyworkRate:90, paintPanels:2, paintRatePerPanel:420, mechanicMontage:280 }
  },
  {
    id: 'civic-front', label: 'Honda Civic Touring 2021', sub: 'Colisão frontal esquerda — farol LED e para-choque', img: '/samples/civic_front.jpg',
    vehicle: { brand:'Honda', model:'Civic Touring 1.5 Turbo', year:'2021', color:'Prata', plate:'BRA-2021', clientName:'Ricardo Silva' },
    parts: [
      { id:'c1', name:'Farol Dianteiro Esquerdo Full LED', category:'Iluminação', actionRequired:'Substituição', severity:'Alto', confidence:0.97, notes:'Lente acrílica e máscara interna destruídas.', selectedChoice:'used', newPrice:{brandName:'Original Honda OEM',price:2850,supplier:'Concessionária Honda',link:'https://lista.mercadolivre.com.br/farol+civic+2021+led+novo'}, usedPrice:{brandName:'Seminova Honda DETRAN',price:1250,supplier:'CDV Sucatas Autorizadas SP',link:'https://lista.mercadolivre.com.br/farol+civic+2021+usado'} },
      { id:'c2', name:'Para-choque Dianteiro com Suportes', category:'Carroceria Frontal', actionRequired:'Substituição', severity:'Alto', confidence:0.93, notes:'Rachadura nos encaixes do paralama.', selectedChoice:'used', newPrice:{brandName:'DTS Paralela 1ª Linha',price:750,supplier:'Distribuidora AutoLatina',link:'https://lista.mercadolivre.com.br/parachoque+civic+2021+novo'}, usedPrice:{brandName:'Original Alinhada DETRAN',price:420,supplier:'Recuperadora AutoSul',link:'https://lista.mercadolivre.com.br/parachoque+civic+2021+usado'} },
    ],
    labor: { bodyworkHours:10, bodyworkRate:90, paintPanels:3, paintRatePerPanel:450, mechanicMontage:380 }
  },
  {
    id: 'corolla-side', label: 'Toyota Corolla XEi 2020', sub: 'Impacto lateral direito — porta e retrovisor', img: '/samples/corolla_side.jpg',
    vehicle: { brand:'Toyota', model:'Corolla XEi 2.0 Flex', year:'2020', color:'Branco Pérola', plate:'TOY-2020', clientName:'Juliana Costa' },
    parts: [
      { id:'t1', name:'Retrovisor Elétrico Direito com Pisca', category:'Elétrica', actionRequired:'Substituição', severity:'Alto', confidence:0.98, notes:'Mecanismo de rebatimento destruído.', selectedChoice:'used', newPrice:{brandName:'Original Toyota OEM',price:1350,supplier:'Concessionária Toyota',link:'https://lista.mercadolivre.com.br/retrovisor+corolla+2020+novo'}, usedPrice:{brandName:'Seminova Toyota RS',price:650,supplier:'CDV Sucatas RS',link:'https://lista.mercadolivre.com.br/retrovisor+corolla+2020+usado'} },
      { id:'t2', name:'Folha da Porta Dianteira Direita', category:'Lataria / Porta', actionRequired:'Substituição', severity:'Alto', confidence:0.91, notes:'Amassado profundo e dobradiças danificadas.', selectedChoice:'used', newPrice:{brandName:'Original Toyota sem Pintura',price:1850,supplier:'Toyota Parts',link:'https://lista.mercadolivre.com.br/porta+corolla+2020+nova'}, usedPrice:{brandName:'Porta Completa Alinhada',price:890,supplier:'Mega Desmanche SP',link:'https://lista.mercadolivre.com.br/porta+corolla+2020+usada'} },
    ],
    labor: { bodyworkHours:8, bodyworkRate:90, paintPanels:2, paintRatePerPanel:480, mechanicMontage:320 }
  },
];

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [images, setImages] = useState([]); // { blobUrl, base64, name }
  const [vehicle, setVehicle] = useState({ brand:'', model:'', year:'', plate:'', color:'', clientName:'' });
  const [parts, setParts] = useState([]);
  const [analysis, setAnalysis] = useState(null);
  const [labor, setLabor] = useState({ bodyworkHours:7, bodyworkRate:90, paintPanels:2, paintRatePerPanel:420, mechanicMontage:280 });
  const [loading, setLoading] = useState(false);
  const [loadingMsg, setLoadingMsg] = useState('');
  const [apiKey, setApiKey] = useState(null); // null=unknown, true=configured, false=missing
  const [showPdf, setShowPdf] = useState(false);
  const [showApiWarning, setShowApiWarning] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();

  // Check API key status on mount
  useEffect(() => {
    fetch('/api/health')
      .then(r => r.json())
      .then(d => {
        setApiKey(d.geminiKeyConfigured);
        if (!d.geminiKeyConfigured) setShowApiWarning(true);
      })
      .catch(() => setApiKey(false));
  }, []);

  const reset = () => {
    setImages([]); setVehicle({ brand:'', model:'', year:'', plate:'', color:'', clientName:'' });
    setParts([]); setAnalysis(null); setShowPdf(false);
  };

  const setVField = (f, v) => setVehicle(prev => ({ ...prev, [f]: v }));

  // Process files (from input or drag-drop)
  const processFiles = async (files) => {
    const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (!validFiles.length) return;

    // IMPORTANT: Clear vehicle form when user uploads new photos manually
    setVehicle({ brand:'', model:'', year:'', plate:'', color:'', clientName:'' });
    setAnalysis(null);
    setParts([]);

    const processed = await Promise.all(validFiles.map(async file => {
      const blobUrl = URL.createObjectURL(file);
      const reader = new FileReader();
      const base64 = await new Promise((res, rej) => {
        reader.onloadend = () => res(reader.result.replace(/^data:[^;]+;base64,/, ''));
        reader.onerror = rej;
        reader.readAsDataURL(file);
      });
      return { blobUrl, base64, name: file.name };
    }));
    setImages(processed);
  };

  const analyze = async () => {
    if (!images.length) return;
    setLoading(true);
    setLoadingMsg('🔍 Convertendo imagens...');

    try {
      const base64s = images.map(i => i.base64);
      setLoadingMsg('🤖 Gemini Vision identificando veículo e avarias...');

      const res = await fetch('/api/analyze-damage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images: base64s, vehicleInfo: vehicle })
      });

      if (!res.ok) throw new Error(`Server error: ${res.status}`);
      const data = await res.json();

      if (!data.success) throw new Error(data.error || 'Unknown server error');

      setLoadingMsg('💰 Buscando preços no Mercado Livre...');
      await new Promise(r => setTimeout(r, 400)); // small UX delay

      setVehicle(prev => ({
        brand: data.vehicle.brand || prev.brand,
        model: data.vehicle.model || prev.model,
        year: data.vehicle.year || prev.year,
        color: data.vehicle.color || prev.color,
        plate: data.vehicle.plate || prev.plate,
        clientName: data.vehicle.clientName || prev.clientName,
      }));
      setAnalysis(data);
      setParts(data.damageAnalysis?.parts || []);
      if (data.damageAnalysis?.laborCosts) setLabor(data.damageAnalysis.laborCosts);

    } catch(e) {
      console.error('Analysis error:', e);
      alert(`Erro na análise: ${e.message}`);
    } finally {
      setLoading(false);
      setLoadingMsg('');
    }
  };

  const loadSample = (sample) => {
    setImages([{ blobUrl: sample.img, base64: '', name: 'sample' }]);
    setVehicle({ ...sample.vehicle });
    setAnalysis({ aiPowered: false, damageAnalysis: { overallSeverity: 'Média', impactZone: 'Frontal', summary: 'Caso de demonstração pré-carregado.' } });
    setParts(sample.parts);
    setLabor(sample.labor);
  };

  const toggleChoice = (id, choice) => setParts(prev => prev.map(p => p.id === id ? { ...p, selectedChoice: choice } : p));

  // Totals
  const bwTotal = labor.bodyworkHours * labor.bodyworkRate;
  const ptTotal = labor.paintPanels * labor.paintRatePerPanel;
  const mcTotal = labor.mechanicMontage;
  const totalLabor = bwTotal + ptTotal + mcTotal;
  let totNew = 0, totSelected = 0;
  parts.forEach(p => {
    totNew += p.newPrice?.price || 0;
    if (p.selectedChoice === 'new') totSelected += p.newPrice?.price || 0;
    else if (p.selectedChoice === 'used') totSelected += p.usedPrice?.price || 0;
  });
  const budgetNew = totNew + totalLabor;
  const budgetSel = totSelected + totalLabor;
  const saving = Math.max(0, budgetNew - budgetSel);
  const savingPct = budgetNew > 0 ? ((saving / budgetNew) * 100).toFixed(1) : 0;

  return (
    <div className="wrap">

      {/* ── HEADER ────────────────────────────────────────────────────── */}
      <header className="card" style={{ padding:'18px 26px', marginBottom:26, borderTop:'3px solid var(--gold)', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:14 }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <div style={{ background:'var(--grad-gold)', width:48, height:48, borderRadius:13, display:'flex', alignItems:'center', justifyContent:'center', fontSize:'1.5rem', boxShadow:'0 0 20px rgba(245,158,11,0.4)' }}>🏎️</div>
          <div>
            <h1 style={{ fontSize:'1.45rem', fontWeight:900 }}>AutoBudget <span className="grad-text">AI</span></h1>
            <p style={{ color:'var(--muted)', fontSize:'.83rem' }}>Vistoria Computacional por Foto • Cotação Real: Peças Novas vs. Usadas (Mercado Livre)</p>
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          {apiKey === true && (
            <span className="badge badge-ai">🤖 Gemini Vision Ativo</span>
          )}
          {apiKey === false && (
            <span className="badge badge-warn" style={{ cursor:'pointer' }} onClick={() => setShowApiWarning(true)}>

                <thead>
                  <tr style={{ background:'#f1f5f9', textAlign:'left' }}>
                    <th style={{ padding:'9px 10px' }}>Item</th><th style={{ padding:'9px 10px' }}>Diagnóstico</th>
                    <th style={{ padding:'9px 10px' }}>Origem</th><th style={{ padding:'9px 10px', textAlign:'right' }}>Valor R$</th>
                  </tr>
                </thead>
                <tbody>
                  {parts.map(p => {
                    const v = p.selectedChoice==='new' ? p.newPrice?.price : p.selectedChoice==='used' ? p.usedPrice?.price : 0;
                    return (
                      <tr key={p.id} style={{ borderBottom:'1px solid #e2e8f0' }}>
                        <td style={{ padding:'9px 10px', fontWeight:600 }}>{p.name}</td>
                        <td style={{ padding:'9px 10px' }}>{p.actionRequired}</td>
                        <td style={{ padding:'9px 10px' }}>{p.selectedChoice==='new'?'Nova OEM':p.selectedChoice==='used'?'Usada DETRAN':'Funilaria'}</td>
                        <td style={{ padding:'9px 10px', textAlign:'right', fontWeight:700 }}>{fmt(v)}</td>
                      </tr>
                    );
                  })}
                  {[['Funilaria & Desamassamento',bwTotal],['Pintura & Estufa',ptTotal],['Mecânica / Montagem',mcTotal]].map(([l,v]) => (
                    <tr key={l} style={{ borderBottom:'1px solid #e2e8f0', background:'#fafafa' }}>
                      <td colSpan={3} style={{ padding:'9px 10px' }}>{l}</td>
                      <td style={{ padding:'9px 10px', textAlign:'right', fontWeight:700 }}>{fmt(v)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {saving > 0 && <div style={{ fontSize:'.85rem', color:'#15803d', fontWeight:700, marginBottom:8 }}>✓ Economia com peças usadas: {fmt(saving)} (-{savingPct}%)</div>}
              <div style={{ textAlign:'right', fontSize:'1.4rem', fontWeight:900, borderTop:'2px solid #cbd5e1', paddingTop:12 }}>
                TOTAL: {fmt(budgetSel)}
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', marginTop:55, paddingTop:16, borderTop:'1px solid #e2e8f0' }}>
                <div style={{ textAlign:'center', width:200 }}><div style={{ borderTop:'1px solid #94a3b8', paddingTop:4, fontSize:'.78rem', color:'#475569', fontWeight:600 }}>Responsável Técnico</div></div>
                <div style={{ textAlign:'center', width:200 }}><div style={{ borderTop:'1px solid #94a3b8', paddingTop:4, fontSize:'.78rem', color:'#475569', fontWeight:600 }}>De Acordo — Cliente</div></div>
              </div>
            </div>
          </div>
        </div>
      )}

      <footer style={{ textAlign:'center', padding:'30px 0 20px', fontSize:'.78rem', color:'var(--dim)' }}>
        AutoBudget AI v2.0 © 2026 — Agente de Vistoria e Orçamento Automotivo por Inteligência Artificial
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
