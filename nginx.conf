server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 48m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location = /index.html {
        add_header Cache-Control 'no-store';
    }

    location ~* ^/assets/.*-[a-zA-Z0-9_-]+\.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_conn analysis_capacity 2;
        limit_conn_status 429;
        error_page 429 = @analysis_busy;
        # Resolve again after a backend task is replaced, including in Swarm.
        set $api_backend backend:5000;
        proxy_pass http://$api_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        add_header Cache-Control 'no-store';
    }

    location @analysis_busy {
        default_type application/json;
        return 429 '{"success":false,"code":"LOCAL_BUSY","error":"Há análises em andamento. Aguarde e tente novamente."}';
    }
}
